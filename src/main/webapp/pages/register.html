
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 40px 15px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f1f5f9;

            background:
                radial-gradient(circle at top left,
                    rgba(79, 70, 229, 0.25), transparent 35%),
                radial-gradient(circle at bottom right,
                    rgba(147, 51, 234, 0.2), transparent 35%),
                #080d1b;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 35px;
            border: 1px solid rgba(99, 102, 241, 0.5);
            border-radius: 20px;

            background: rgba(17, 25, 45, 0.92);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);

            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: 1px;

            background: linear-gradient(90deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        input:not([type="checkbox"]),
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #334766;
            border-radius: 10px;

            background-color: #131e35;
            color: #f8fafc;
            font-size: 14px;

            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:not([type="checkbox"]):focus,
        select:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background-color: #182541;
        }

        select option {
            background-color: #131e35;
            color: #f8fafc;
        }

        input[type="date"] {
            color-scheme: dark;
        }

        fieldset {
            border: 1px solid #334766;
            border-radius: 10px;
            padding: 16px;
            background-color: #101a2e;
        }

        legend {
            color: #c4b5fd;
            padding: 0 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .languages {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            margin: 0;
            font-weight: 400;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #818cf8;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-btn {
            color: white;
            background: linear-gradient(110deg, #9333ea, #2563eb);
            box-shadow: 0 5px 20px rgba(79, 70, 229, 0.2);
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .reset-btn {
            color: #cbd5e1;
            background: transparent;
            border: 1px solid #475569;
        }

        .reset-btn:hover {
            background: #1e293b;
            border-color: #818cf8;
            color: white;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Register Form</h1>
        <p class="subtitle">Create your account and get started</p>

        <form action="../register.jsp" method="post">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input minlength="8" type="password" id="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="governerate">Governorate</label>
                <select id="governerate" name="governerate" required>
                    <option value="">Select Governorate</option>
                    <option value="Cairo">Cairo</option>
                    <option value="Giza">Giza</option>
                    <option value="Alexandria">Alexandria</option>
                    <option value="Monufia">Monufia</option>
                    <option value="Dakahlia">Dakahlia</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="birthdate">Birth Date</label>
                <input type="date" id="birthdate"
                       name="birthdate" required>
            </div>

            <div class="form-group">
                <fieldset>
                    <legend>Languages</legend>

                    <div class="languages">
                        <label class="language-option">
                            <input type="checkbox" name="languages"
                                   value="Arabic">
                            Arabic
                        </label>

                        <label class="language-option">
                            <input type="checkbox" name="languages"
                                   value="English">
                            English
                        </label>

                       
                    </div>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="status">Account Status</label>
                <select id="active" name="status" required>
                    <option value="true">Dark Mode</option>
                    <option value="false">White Mode</option>
                </select>
            </div>

            <div class="buttons">
                <button type="submit" class="register-btn">
                    Register
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

    </div>

</body>
</html>
